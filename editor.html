<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trình chỉnh sửa thiệp – WEDSTORY</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Great+Vibes&family=Dancing+Script:wght@500&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
body{background:#f6eff1;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.ed-top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px;flex:0 0 auto}
.ed-top .logo{font-size:1.15rem}.ed-top .logo svg{width:28px;height:28px}
.ed-top .acts{display:flex;gap:8px;align-items:center}
.save-state{font-size:.8rem;color:var(--muted)}
.ed{flex:1;display:grid;grid-template-columns:440px 1fr;min-height:0}
.panel{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:14px}
.stage{display:flex;align-items:center;justify-content:center;padding:20px;position:relative;background:radial-gradient(circle at 30% 20%,#fde8ec,transparent 50%),radial-gradient(circle at 80% 90%,#fbeccf,transparent 50%)}
.stage .phone{position:relative;width:380px;height:min(780px,calc(100vh - 120px));transform:none;animation:none}
.stage iframe{width:100%;height:100%;border:0;border-radius:30px;background:#fff}
.dev-switch{position:absolute;top:14px;right:18px;display:flex;gap:6px}
.stage.desktop .phone{width:min(100%,1000px);border-radius:14px;padding:6px}
.stage.desktop iframe{border-radius:10px}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc>summary{list-style:none;padding:14px 16px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"›";transform:rotate(90deg);transition:.2s;color:var(--rose);font-size:1.3rem}
.acc[open]>summary::after{transform:rotate(-90deg)}
.acc[open]>summary{background:var(--blush);color:var(--rose-d)}
.acc .body{padding:16px;display:grid;gap:12px}
.acc .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field input[type=color]{padding:2px;height:42px}
.tpl-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl-pick button{position:relative;aspect-ratio:3/4.2;border-radius:10px;overflow:hidden;border:2px solid transparent;transition:.2s}
.tpl-pick button.on{border-color:var(--rose);box-shadow:0 0 0 3px var(--blush)}
.tpl-pick .tpl-mini{padding:8px 4px}.tpl-pick .tm-photo{width:42%;margin-bottom:2px;border-width:2px}.tpl-pick .tm-names{margin:2px 0 10px}.tpl-pick .tm-names{font-size:.95rem}.tpl-pick .tm-top,.tpl-pick .tm-date{font-size:.42rem}
.tpl-pick small{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.85);font-size:.66rem;padding:3px;color:#333}
.item{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;position:relative}
.item .rm{position:absolute;top:6px;right:8px;color:#c33;font-size:1.2rem}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:8px;background:#eee center/cover}
.thumbs button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;line-height:1}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggles label{display:flex;gap:8px;align-items:center;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.toggles input{accent-color:var(--rose);width:16px;height:16px}
.hint{font-size:.8rem;color:var(--muted)}
.upload{display:flex;gap:8px}
.upload input[type=url]{flex:1}
.upload label{white-space:nowrap}
.mobile-tabs{display:none}
/* Thanh tab của thanh công cụ */
.panel{padding:0}
.ed-tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.ed-tabs button{display:flex;align-items:center;gap:6px;padding:9px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font:600 .78rem var(--f-body);color:var(--muted);text-align:left;line-height:1.2;cursor:pointer;transition:.2s}
.ed-tabs button i{font-style:normal;font-size:1.05rem;flex:0 0 auto}
.ed-tabs button:hover{border-color:var(--rose);color:var(--rose-d)}
.ed-tabs button.on{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 6px 14px rgba(200,80,106,.25)}
.ed-pane{padding:16px;display:grid;gap:14px;animation:fade .25s}
.pane-h{font-family:var(--f-head);font-size:1.25rem;display:grid;gap:2px}
.pane-h span{font-family:var(--f-body);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--rose);font-weight:700}
.panel{display:flex;flex-direction:column}
.ed-pane{flex:1 0 auto}
/* Chân thanh công cụ: nút Quay lại / Tiếp tục luôn ghim ở đáy */
.step-nav{position:sticky;bottom:0;z-index:5;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px 12px;box-shadow:0 -6px 16px rgba(166,58,84,.06)}
.step-bar{height:4px;border-radius:4px;background:var(--line);margin-bottom:10px;overflow:hidden}
.step-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),#e27d8f);border-radius:4px;transition:width .35s ease}
.step-btns{display:flex;gap:8px;align-items:center}
.step-back{flex:0 0 auto}
.step-back:disabled{opacity:.4;cursor:not-allowed;transform:none}
.step-next{flex:1;justify-content:center;padding:12px 16px;font-size:.9rem;white-space:normal;line-height:1.25}
.ed-tabs button.done{color:var(--rose-d);border-color:#f0d0d8}
.ed-tabs button.done span::after{content:" ✓";color:#2d7a43}
.card-box{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;background:#fffafb}
.box-h{font-size:.95rem;color:var(--rose-d)}
.ed-pane .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.img-prev{height:110px;border-radius:12px;background:#eee center/cover;margin-top:6px}
.thumbs div.is-cover{outline:3px solid var(--rose);outline-offset:-3px}
.thumbs .set-cover{left:2px;right:auto;background:rgba(255,255,255,.9);color:var(--rose-d)}
.thumbs div.is-cover .set-cover{background:var(--rose);color:#fff}
.drop-up{display:grid;justify-items:center;gap:2px;padding:18px;border:2px dashed #e9c3cc;border-radius:14px;background:var(--blush);cursor:pointer;text-align:center;transition:.2s}
.drop-up:hover{border-color:var(--rose);background:#fde9ee}
.drop-up b{color:var(--rose-d)}.drop-up small{color:var(--muted);font-size:.78rem}
.gift-row{display:grid;grid-template-columns:1fr 132px;gap:12px;align-items:start}
.gift-fields{display:grid;gap:10px}
.qr-prev{width:132px;min-height:132px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:6px;text-align:center;font-size:.72rem;color:var(--muted)}
.qr-prev img,.qr-prev canvas{width:118px!important;height:118px!important;object-fit:contain}
.link-btn{float:right;font-size:.72rem;color:var(--rose);text-decoration:underline;background:none;border:0;cursor:pointer;font-weight:600}
.mini-acc{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mini-acc>summary{padding:11px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
.mini-acc[open]>summary{background:var(--blush);color:var(--rose-d)}
.mini-acc>.body,.mini-acc>.field{padding:12px 14px;display:grid;gap:10px}
@media(max-width:420px){.ed-tabs{grid-template-columns:repeat(2,1fr)}.gift-row{grid-template-columns:1fr}.qr-prev{margin:0 auto}.ed-pane .row{grid-template-columns:1fr}}
@media(max-width:900px){
  .ed{grid-template-columns:1fr}
  .stage{display:none}.show-preview .stage{display:flex}.show-preview .panel{display:none}
  .mobile-tabs{display:flex;gap:6px}
  .ed-top .save-state,.ed-top .logo span{display:none}
  .stage .phone{width:100%;max-width:400px}
}
</style>
</head>
<body>
<div class="ed-top">
  <a href="index.html" class="logo" id="logo" aria-label="WEDSTORY – Trang chủ"><span class="brand">WED<em>STORY</em></span></a>
  <div class="mobile-tabs"><button class="chip active" data-tab="edit">Sửa</button><button class="chip" data-tab="preview">Xem</button></div>
  <div class="acts"><span class="save-state" id="saveState">Chưa lưu</span>
    <button class="btn btn-outline btn-sm" id="btnView">Mở thiệp</button>
    <button class="btn btn-primary btn-sm" id="btnShare">Lưu &amp; chia sẻ</button></div>
</div>
<div class="ed">
  <aside class="panel" id="panel"></aside>
  <main class="stage" id="stage">
    <div class="dev-switch"><button class="chip active" data-dev="phone">📱</button><button class="chip" data-dev="desktop">🖥</button></div>
    <div class="phone"><iframe id="pv" src="thiep.html?preview=1" title="Xem trước"></iframe></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/invite.js"></script>
<script src="assets/js/editor.js"></script>
</body>
</html>
