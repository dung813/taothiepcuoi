<h1>Liên hệ với chúng tôi</h1><p>Cần hỗ trợ tạo thiệp, hợp tác hay góp ý? Hãy để lại lời nhắn nhé.</p></div></section>
<section class="section" style="padding-top:30px"><div class="container contact-wrap">
  <div class="contact-info reveal"><h3>WEDSTORY</h3><p style="opacity:.85">Chúng tôi phản hồi trong vòng 24 giờ làm việc.</p>
    <div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><div><b>Email</b><br>hello@thiephong.vn</div></div>
    <div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><div><b>Hotline / Zalo</b><br>0900 000 000</div></div>
    <div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s-8-6-8-12a8 8 0 0 1 16 0c0 6-8 12-8 12z"/><circle cx="12" cy="10" r="3"/></svg><div><b>Địa chỉ</b><br>TP. Hồ Chí Minh, Việt Nam</div></div>
    <div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>Giờ làm việc</b><br>8:00 – 21:00, Thứ 2 – Chủ nhật</div></div>
  </div>
  <form class="contact-form form-grid reveal d1" id="contactForm">
    <div class="field"><label>Họ tên *</label><input name="name" required></div>
    <div class="field"><label>Số điện thoại</label><input name="phone"></div>
    <div class="field full"><label>Email *</label><input type="email" name="email" required></div>
    <div class="field full"><label>Chủ đề</label><select name="topic"><option>Hỗ trợ tạo thiệp</option><option>Gói Trọn gói / thiết kế riêng</option><option>Chương trình đối tác</option><option>Góp ý</option></select></div>
    <div class="field full"><label>Nội dung *</label><textarea name="msg" required></textarea></div>
    <div class="field full"><button class="btn btn-primary" style="justify-content:center">Gửi lời nhắn</button></div>
  </form>
</div></section>
