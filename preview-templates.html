                    <circle cx="20" cy="27" r="2.5" fill="#B38F6D"/>
                  </svg>
                </div>

                {/* Gold Wax Seal Bottom-Right */}
                <div className="absolute -bottom-2 -right-2 z-20">
                  <div className="h-8 w-8 rounded-full wax-seal-gold flex items-center justify-center text-amber-900 text-[9px] font-serif font-bold shadow-md">
                    ♥
                  </div>
                </div>
              </div>
            </div>

            <div className="text-center text-[10px] font-mono text-stone-600 uppercase tracking-widest font-semibold">
              {couple.dateFormatted}
            </div>
          </div>
        );
      }

      // 3. ROYAL GREEN / RED ARCHED GATE (Card 3 & Card 5 trong ảnh)
      if (styleType === 'royal-green-arch' || styleType === 'imperial-red-arch') {
        const archBg = template.archColor || (styleType === 'royal-green-arch' ? '#153621' : '#85121A');
        return (
          <div
            onClick={() => onPreview(template)}
            className={`group relative [aspect-ratio:1000/1470] w-full ${bgTone || 'bg-[#FAF6EE]'} overflow-hidden rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.08)] hover:shadow-[0_12px_28px_rgba(0,0,0,0.18)] transition-all duration-300 transform hover:-translate-y-2 cursor-pointer flex flex-col justify-between border border-stone-300/60 select-none`}
          >
            {/* Top Arched Gate Header */}
            <div
              className="relative w-full pt-3 pb-3 px-3 text-center text-amber-100 flex flex-col items-center justify-center rounded-t-xl"
              style={{
                backgroundColor: archBg,
                clipPath: 'polygon(0 0, 100% 0, 100% 86%, 50% 100%, 0 86%)',
                paddingBottom: '22px'
              }}
            >
              {/* Badge */}
              <div className="absolute top-2 right-2">
                <span className="rounded-full bg-rose-600 px-2 py-0.5 text-[8.5px] font-bold text-white shadow-xs">
                  {badge}
                </span>
              </div>

              <span className="text-[7.5px] font-serif tracking-[0.25em] text-amber-200 uppercase block mb-1">
                WELCOME TO OUR WEDDING
              </span>

              {/* Family titles + Double Happiness 囍 */}
              <div className="flex items-center justify-center gap-3 my-0.5">
                <div className="text-right">
                  <span className="text-[7px] text-amber-200 block">{couple.groomRole || 'Trưởng Nam'}</span>
                  <span className="font-serif text-[11px] font-bold tracking-wider">{couple.groom}</span>
                </div>

                <span className="font-serif text-xl text-amber-300 leading-none drop-shadow-sm px-1">
                  囍
                </span>

                <div className="text-left">
                  <span className="text-[7px] text-amber-200 block">{couple.brideRole || 'Út Nữ'}</span>
                  <span className="font-serif text-[11px] font-bold tracking-wider">{couple.bride}</span>
                </div>
              </div>

              {/* Curved Motto */}
              <span className="text-[7.5px] font-sans tracking-[0.3em] text-amber-200/90 uppercase mt-0.5">
                LOVE NEVER FAILS
              </span>
            </div>

            {/* Lower Photo Window inside Arch: Full View, Not Chopped! */}
            <div className="relative flex-1 w-full p-2 pt-0 -mt-2">
              <div className="w-full h-full rounded-b-xl overflow-hidden shadow-inner bg-stone-100">
                <img
                  src={images.main}
                  alt={couple.groom}
                  className="w-full h-full object-cover object-top transition-transform duration-500 group-hover:scale-103"
                />
              </div>
            </div>
          </div>
        );
      }

      // 4. BOTANICAL DUAL PORTRAIT (Card 4 trong ảnh)
      if (styleType === 'botanical-dual') {
        return (
          <div
            onClick={() => onPreview(template)}
            className={`group relative [aspect-ratio:1000/1470] w-full ${bgTone || 'bg-[#EDF3EB]'} overflow-hidden rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.08)] hover:shadow-[0_12px_28px_rgba(0,0,0,0.18)] transition-all duration-300 transform hover:-translate-y-2 cursor-pointer p-3 flex flex-col justify-between border border-stone-200/60 select-none`}
          >
            {/* Top Foliage Illustration Header */}
            <div className="flex items-start justify-between z-20">
              <div className="flex items-center gap-1.5">
                <span className="text-sm">🌿</span>
                <span className="text-[9px] font-serif italic text-emerald-900 font-semibold tracking-wide">Wedding Invitation</span>
              </div>
              <span className="rounded-full bg-rose-600 px-2 py-0.5 text-[8.5px] font-bold text-white shadow-xs">
                {badge}
              </span>
            </div>

            {/* Two Separate Framed Portraits (Groom & Bride) */}
            <div className="relative flex-1 flex flex-col justify-around py-1">
              {/* Top Photo: Groom */}
              <div className="flex items-center gap-2.5">
                <div className="w-[46%] aspect-[4/4.8] bg-white p-1 rounded-sm shadow-md border border-amber-600/30 overflow-hidden">
                  <img
                    src={images.groomPhoto}
                    alt={couple.groom}
                    className="w-full h-full object-cover object-top"
                  />
                </div>
                <div className="text-left">
                  <span className="text-[8px] font-sans text-stone-600 uppercase block font-semibold">{couple.groomRole}</span>
                  <h4 className="font-serif text-base text-stone-900 font-semibold">{couple.groom}</h4>
                </div>
              </div>

              {/* Divider bar */}
              <div className="w-full h-px bg-emerald-900/15 my-0.5" />

              {/* Bottom Photo: Bride (Staggered to right) */}
              <div className="flex items-center justify-end gap-2.5 flex-row-reverse">
                <div className="w-[46%] aspect-[4/4.8] bg-white p-1 rounded-sm shadow-md border border-amber-600/30 overflow-hidden">
                  <img
                    src={images.bridePhoto}
                    alt={couple.bride}
                    className="w-full h-full object-cover object-top"
                  />
                </div>
                <div className="text-right">
                  <span className="text-[8px] font-sans text-stone-600 uppercase block font-semibold">{couple.brideRole}</span>
                  <h4 className="font-serif text-base text-stone-900 font-semibold">{couple.bride}</h4>
                </div>
              </div>
            </div>

            {/* Bottom Foliage Accent */}
            <div className="text-center pt-1 border-t border-emerald-900/10 text-[9px] font-mono tracking-widest text-emerald-950 uppercase font-semibold">
              {couple.dateFormatted}
            </div>
          </div>
        );
      }

      // 5. FILMSTRIP TRIPTYCH (Main photo + 3 Polaroid mini thumbnails ở chân thẻ)
      if (styleType === 'filmstrip-triptych') {
        const strip1 = images.strip1 || images.main;
        const strip2 = images.strip2 || images.main;
        const strip3 = images.strip3 || images.main;
        return (
          <div
            onClick={() => onPreview(template)}
            className={`group relative [aspect-ratio:1000/1470] w-full ${bgTone || 'bg-[#7A242B]'} overflow-hidden rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.08)] hover:shadow-[0_12px_28px_rgba(0,0,0,0.18)] transition-all duration-300 transform hover:-translate-y-2 cursor-pointer p-3 flex flex-col justify-between border border-white/20 select-none`}
          >
            {/* Top Bar */}
            <div className="flex items-center justify-between">
              <span className="text-[8.5px] font-sans tracking-[0.25em] text-white/80 uppercase font-semibold">
                WEDDING INVITATION
              </span>
              <span className="rounded-full bg-rose-600 px-2 py-0.5 text-[8.5px] font-bold text-white shadow-xs">
                {badge}
              </span>
            </div>

            {/* Main Top Photograph - Clean & High Clarity */}
            <div className="relative w-full h-[50%] rounded-xl overflow-hidden shadow-sm ring-1 ring-white/10 bg-stone-100 my-1">
              <img
                src={images.main}
                alt={couple.groom}
                className="w-full h-full object-cover object-top transition-transform duration-500 group-hover:scale-103"
              />
            </div>

            {/* Middle Typography Banner */}
            <div className="text-center py-1 bg-white/95 backdrop-blur-sm rounded-md shadow-xs border border-white/40">
              <h3 className="font-serif text-lg text-stone-900 font-medium">
                {couple.groom} &amp; {couple.bride}
              </h3>
              <p className="text-[8.5px] font-mono tracking-widest uppercase text-stone-600 font-semibold">
                {couple.dateFormatted}
              </p>
            </div>

            {/* Dải 3 Ảnh Polaroid Mini Ở Chân Thẻ */}
            <div className="grid grid-cols-3 gap-1.5 w-full mt-1">
              <div className="aspect-square rounded-md overflow-hidden border border-white shadow-xs">
                <img src={strip1} alt="Film 1" className="h-full w-full object-cover object-top" />
              </div>
              <div className="aspect-square rounded-md overflow-hidden border border-white shadow-xs">
                <img src={strip2} alt="Film 2" className="h-full w-full object-cover object-top" />
              </div>
              <div className="aspect-square rounded-md overflow-hidden border border-white shadow-xs">
                <img src={strip3} alt="Film 3" className="h-full w-full object-cover object-top" />
              </div>
            </div>
          </div>
        );
      }


      // 6. CINEMATIC FULL BLEED SCRIPT
      if (styleType === 'full-bleed-script' || styleType === 'sunset-cinematic' || styleType === 'forest-emerald') {
        const titleText = template.displayTitle || template.displayScript || 'Our Love Begins';
        return (
          <div
            onClick={() => onPreview(template)}
            className="group relative [aspect-ratio:1000/1470] w-full bg-stone-900 overflow-hidden rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.1)] hover:shadow-[0_12px_28px_rgba(0,0,0,0.22)] transition-all duration-300 transform hover:-translate-y-2 cursor-pointer border border-stone-800 select-none"
          >
            {/* Full-bleed Photo: completely uncropped from top */}
            <img
              src={images.main}
              alt={couple.groom}
              className="absolute inset-0 w-full h-full object-cover object-top transition-transform duration-700 group-hover:scale-105"
            />
            {/* Vignette Overlay */}
            <div className="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/85 pointer-events-none" />

            {/* Badge */}
            <div className="absolute top-3 right-3 z-20">
              <span className="rounded-full bg-rose-600 px-2 py-0.5 text-[8.5px] font-bold text-white shadow-xs">
                {badge}
              </span>
            </div>

            {/* Content Overlay */}
            <div className="relative z-10 h-full p-4 flex flex-col justify-between text-center text-white">
              <span className="text-[8.5px] font-sans tracking-[0.25em] text-white/80 uppercase font-semibold">
                WEDDING INVITATION
              </span>

              <div className="my-auto">
                <h2 className="font-script text-3xl sm:text-4xl text-white drop-shadow-md">
                  {titleText}
                </h2>
              </div>

              <div className="pb-1">
                <h3 className="font-serif text-lg text-white font-medium tracking-wide">
                  {couple.groom} &amp; {couple.bride}
                </h3>
                <p className="text-[9px] font-mono tracking-widest text-white/80 uppercase mt-0.5 font-semibold">
                  {couple.dateFormatted}
                </p>
              </div>
            </div>
          </div>
        );
      }

      // 7. DEFAULT STUDIO MINIMALIST
      return (
        <div
          onClick={() => onPreview(template)}
          className={`group relative [aspect-ratio:1000/1470] w-full ${bgTone || 'bg-[#FAF8F5]'} overflow-hidden rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.08)] hover:shadow-[0_12px_28px_rgba(0,0,0,0.18)] transition-all duration-300 transform hover:-translate-y-2 cursor-pointer p-3.5 flex flex-col justify-between border border-stone-300/60 select-none`}
        >
          {/* Top Bar */}
          <div className="flex items-center justify-between">
            <span className="text-[9px] font-serif tracking-[0.25em] text-stone-600 uppercase font-semibold">
              SAVE THE DATE
            </span>
            <span className="rounded-full bg-rose-600 px-2 py-0.5 text-[8.5px] font-bold text-white shadow-xs">
              {badge}
            </span>
          </div>

          {/* Central Portrait without cutting: object-top */}
          <div className="relative my-2 flex-1 w-full rounded-xl overflow-hidden shadow-xs ring-1 ring-black/5 bg-stone-100">
            <img
              src={images.main}
              alt={couple.groom}
              className="h-full w-full object-cover object-top transition-transform duration-500 group-hover:scale-103"
            />
          </div>

          <div className="text-center pt-1">
            <h2 className="font-script text-2xl text-stone-900 leading-tight">
              {template.displayScript || 'Save The Date'}
            </h2>
            <h3 className="font-serif text-base text-stone-800 tracking-wider font-normal mt-0.5">
              {couple.groom} &amp; {couple.bride}
            </h3>
            <p className="text-[9px] font-mono tracking-widest text-stone-600 uppercase mt-0.5 font-semibold">
              {couple.dateFormatted}
            </p>
          </div>
        </div>
      );
    };

    // ==========================================
    // MAIN APP
    // ==========================================
    const App = () => {
      const [filterCategory, setFilterCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [previewTemplate, setPreviewTemplate] = useState(null);

      const filtered = useMemo(() => {
        return mockTemplates.filter(t => {
          if (filterCategory !== 'all' && t.category !== filterCategory) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            if (!t.name.toLowerCase().includes(q) && !t.category.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [filterCategory, searchQuery]);

      const categories = [
        { id: 'all', label: 'Tất cả 20 mẫu' },
        { id: 'Phong bì nhung', label: '💌 Phong bì nhung' },
        { id: 'Polaroid nghệ thuật', label: '📸 Polaroid & Tape' },
        { id: 'Cổng vòm xanh', label: '🌿 Cổng vòm xanh' },
        { id: 'Song ảnh hoa lá', label: '🌸 Song ảnh hoa lá' },
        { id: 'Song Hỷ Đỏ truyền thống', label: '囍 Song Hỷ truyền thống' },
        { id: 'Dải phim Polaroid', label: '🎞️ Dải phim Polaroid' },
      ];

      return (
        <div className="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
          {/* Header giống web mẫu Chung Đôi / WedStory */}
          <header className="text-center max-w-2xl mx-auto mb-8">
            <h1 className="text-3xl sm:text-4xl font-sans font-bold text-stone-900 tracking-tight">
              Mẫu thiệp mời đám cưới
            </h1>
            <p className="mt-2 text-sm text-stone-500 font-light">
              Tạo miễn phí · Thử 3 ngày · Đẹp mới thanh toán<br/>
              Bạn có thể đổi mẫu bất cứ lúc nào khi chỉnh sửa
            </p>
          </header>

          {/* Filter Pills */}
          <div className="flex items-center justify-start sm:justify-center overflow-x-auto no-scrollbar gap-2 pb-3 mb-6">
            {categories.map(cat => (
              <button
                key={cat.id}
                onClick={() => setFilterCategory(cat.id)}
                className={`whitespace-nowrap rounded-full px-4 py-1.5 text-xs font-medium transition-all ${
                  filterCategory === cat.id
                    ? 'bg-rose-600 text-white shadow-sm'
                    : 'bg-white text-stone-600 hover:bg-stone-100 border border-stone-200'
                }`}
              >
                {cat.label}
              </button>
            ))}
          </div>

          {/* Cards Grid: Bố cục 5 cột chuẩn web mẫu */}
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-5">
            {filtered.map(template => (
              <WeddingCard
                key={template.id}
                template={template}
                onPreview={(tpl) => setPreviewTemplate(tpl)}
              />
            ))}
          </div>

          {/* Modal Preview */}
          {previewTemplate && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
              onClick={() => setPreviewTemplate(null)}
            >
              <div
                className="relative w-full max-w-lg bg-white rounded-2xl overflow-hidden shadow-2xl p-6 flex flex-col items-center"
                onClick={e => e.stopPropagation()}
              >
                <button
                  onClick={() => setPreviewTemplate(null)}
                  className="absolute top-3 right-3 text-stone-400 hover:text-stone-800 text-lg font-bold"
                >
                  ✕
                </button>
                <div className="w-[240px] shadow-xl rounded-xl overflow-hidden my-3">
                  <WeddingCard template={previewTemplate} onPreview={() => {}} />
                </div>
                <h3 className="font-serif text-xl font-bold text-stone-900 mt-2">
                  {previewTemplate.name}
                </h3>
                <p className="text-xs text-stone-500 font-light mt-0.5">
                  Phong cách: {previewTemplate.category}
                </p>
                <button
                  onClick={() => { alert(`Đã chọn mẫu: ${previewTemplate.name}`); setPreviewTemplate(null); }}
                  className="mt-5 w-full rounded-full bg-stone-900 py-3 text-xs font-bold text-white uppercase tracking-wider hover:bg-stone-800 shadow-md"
                >
                  Dùng mẫu này để tạo thiệp
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
