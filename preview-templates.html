                </span>
              </div>
              <p className="text-xs text-stone-500 font-light">Tự động cá nhân hoá lời mời thiệp cưới theo nhóm đối tượng</p>
            </div>
          </div>

          {/* Tab Switcher */}
          <div className="flex bg-stone-100 p-1 rounded-xl mb-4 gap-1">
            <button
              onClick={() => setActiveTab('invitation')}
              className={`flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                activeTab === 'invitation' ? 'bg-white text-rose-700 shadow-sm' : 'text-stone-600 hover:text-stone-900'
              }`}
            >
              💌 Cá nhân hoá lời mời thiệp
            </button>
            <button
              onClick={() => setActiveTab('wish')}
              className={`flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                activeTab === 'wish' ? 'bg-white text-rose-700 shadow-sm' : 'text-stone-600 hover:text-stone-900'
              }`}
            >
              💬 Soạn lời chúc cưới
            </button>
          </div>

          {activeTab === 'invitation' ? (
            <div className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-stone-700 mb-1.5">1. Chọn Nhóm khách mời</label>
                <div className="grid grid-cols-2 gap-1.5 mb-2">
                  {guestGroups.map(grp => (
                    <button
                      type="button"
                      key={grp.value}
                      onClick={() => { setGuestGroup(grp.value); setCustomGroup(''); }}
                      className={`p-2 rounded-lg border text-left transition-all ${
                        guestGroup === grp.value && !customGroup
                          ? 'border-rose-600 bg-rose-50 text-rose-800 font-bold'
                          : 'border-stone-200 bg-white text-stone-700 hover:bg-stone-50 text-xs'
                      }`}
                    >
                      <div className="text-xs">{grp.label}</div>
                      <div className="text-[10px] text-stone-400 font-normal">{grp.desc}</div>
                    </button>
                  ))}
                </div>
                <input
                  type="text"
                  placeholder="Hoặc tự nhập tên nhóm (VD: CLB Cầu lông, Team Marketing...)"
                  value={customGroup}
                  onChange={e => setCustomGroup(e.target.value)}
                  className="w-full px-3 py-2 text-xs border border-stone-300 rounded-lg outline-none focus:border-rose-600 focus:ring-1 focus:ring-rose-600"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-stone-700 mb-1">2. Phong cách mong muốn</label>
                <select
                  value={invitationTone}
                  onChange={e => setInvitationTone(e.target.value)}
                  className="w-full px-3 py-2 text-xs border border-stone-300 rounded-lg outline-none focus:border-rose-600 focus:ring-1 focus:ring-rose-600 bg-white"
                >
                  <option value="Tự nhiên & Chuẩn mực theo nhóm">✨ Tự động theo chuẩn văn phong nhóm (Khuyên dùng)</option>
                  <option value="Thân mật, vui vẻ & Hóm hỉnh">😄 Thân mật, vui tươi &amp; Hóm hỉnh</option>
                  <option value="Lễ phép, kính cẩn & Đầm ấm gia phong">👵 Lễ phép, kính cẩn &amp; Chuẩn truyền thống</option>
                  <option value="Trang trọng, lịch thiệp & Tôn quý">🎩 Trang trọng, lịch thiệp &amp; Đẳng cấp</option>
                  <option value="Lãng mạn, tinh tế & Cảm xúc">🌹 Lãng mạn, sâu lắng &amp; Tinh tế</option>
                </select>
              </div>

              <button
                type="button"
                onClick={handleGenerateInvitation}
                disabled={isLoading}
                className="w-full mt-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-rose-700 to-amber-700 text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-md hover:brightness-105 transition-all disabled:opacity-60"
              >
                {isLoading ? '⏳ Gemini AI đang soạn lời mời…' : '✨ Gemini AI Tạo Lời Mời Cá Nhân Hoá'}
              </button>

              {generatedInvitation && (
                <div className="mt-3 p-4 rounded-xl bg-rose-50/70 border border-rose-200">
                  <div className="flex justify-between items-center mb-1.5">
                    <span className="text-[11px] font-bold uppercase tracking-wider text-rose-700">
                      📜 Lời mời nhóm: {generatedInvitation.group}
                    </span>
                  </div>
                  {generatedInvitation.quote && (
                    <div className="mb-2">
                      <div className="text-[10px] text-stone-500 font-semibold uppercase">Thông điệp mở đầu:</div>
                      <p className="text-xs text-stone-700 italic bg-white p-2 rounded border border-rose-100">
                        “{generatedInvitation.quote}”
                      </p>
                    </div>
                  )}
                  <div>
                    <div className="text-[10px] text-stone-500 font-semibold uppercase">Lời mời chính:</div>
                    <p className="text-xs text-stone-900 leading-relaxed bg-white p-2.5 rounded border border-rose-100 mb-3">
                      {generatedInvitation.message}
                    </p>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => handleCopyText(`“${generatedInvitation.quote}”\n\n${generatedInvitation.message}`)}
                      className="px-3 py-1.5 bg-white border border-stone-200 rounded-lg text-xs font-medium text-stone-700 hover:bg-stone-50 flex items-center gap-1.5 shadow-sm"
                    >
                      <span>{copied ? '✅' : '📋'}</span>
                      <span>{copied ? 'Đã sao chép!' : 'Sao chép'}</span>
                    </button>
                    {onClose && (
                      <button
                        onClick={onClose}
                        className="px-3 py-1.5 bg-rose-700 text-white rounded-lg text-xs font-semibold ml-auto shadow-sm hover:bg-rose-800"
                      >
                        Xong
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-stone-700 mb-1">Tên của bạn</label>
                <input
                  type="text"
                  value={guestName}
                  onChange={e => setGuestName(e.target.value)}
                  placeholder="Ví dụ: Hoàng Long, Chị Thuỳ Dung..."
                  className="w-full px-3 py-2 text-xs border border-stone-300 rounded-lg outline-none focus:border-rose-600 focus:ring-1 focus:ring-rose-600"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-stone-700 mb-1">Mối quan hệ</label>
                <select
                  value={relationship}
                  onChange={e => setRelationship(e.target.value)}
                  className="w-full px-3 py-2 text-xs border border-stone-300 rounded-lg outline-none focus:border-rose-600 focus:ring-1 focus:ring-rose-600 bg-white"
                >
                  <option value="Bạn thân">👭 Bạn thân thiết</option>
                  <option value="Đồng nghiệp">💼 Đồng nghiệp / Công ty</option>
                  <option value="Họ hàng">🏡 Họ hàng / Người thân</option>
                  <option value="Bạn học cũ">🎓 Bạn thời học sinh / Sinh viên</option>
                  <option value="Anh / Chị / Em">🌸 Anh / Chị / Em</option>
                  <option value="Người lớn / Bác / Cô / Chú">👴 Bác / Cô / Chú / Người lớn tuổi</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-stone-700 mb-1">Phong cách mong muốn</label>
                <select
                  value={wishTone}
                  onChange={e => setWishTone(e.target.value)}
                  className="w-full px-3 py-2 text-xs border border-stone-300 rounded-lg outline-none focus:border-rose-600 focus:ring-1 focus:ring-rose-600 bg-white"
                >
                  <option value="Chân thành & Ấm áp">💖 Chân thành &amp; Ấm áp</option>
                  <option value="Hài hước & Dí dỏm">😄 Hài hước &amp; Vui vẻ</option>
                  <option value="Trang trọng & Lịch sự">🎩 Trang trọng &amp; Lịch thiệp</option>
                  <option value="Ngắn gọn & Súc tích">⚡ Ngắn gọn &amp; Ý nghĩa</option>
                </select>
              </div>

              <button
                type="button"
                onClick={handleGenerateWish}
                disabled={isLoading}
                className="w-full mt-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-rose-700 to-amber-700 text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-md hover:brightness-105 transition-all disabled:opacity-60"
              >
                {isLoading ? '⏳ Gemini AI đang sáng tác…' : '✨ Tạo Lời Chúc Bằng AI'}
              </button>

              {generatedWish && (
                <div className="mt-3 p-4 rounded-xl bg-rose-50/70 border border-rose-200">
                  <p className="text-xs text-stone-800 leading-relaxed italic mb-3">
                    "{generatedWish}"
                  </p>
                  <button
                    onClick={() => handleCopyText(generatedWish)}
                    className="px-3 py-1.5 bg-white border border-stone-200 rounded-lg text-xs font-medium text-stone-700 hover:bg-stone-50 flex items-center gap-1.5 shadow-sm"
                  >
                    <span>{copied ? '✅' : '📋'}</span>
                    <span>{copied ? 'Đã sao chép!' : 'Sao chép'}</span>
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // MAIN APP
    // ==========================================
    const App = () => {
      const [filterCategory, setFilterCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [previewTemplate, setPreviewTemplate] = useState(null);
      const [showAiWishModal, setShowAiWishModal] = useState(false);

      const filtered = useMemo(() => {
        return mockTemplates.filter(t => {
          if (filterCategory !== 'all' && t.category !== filterCategory) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            if (!t.name.toLowerCase().includes(q) && !t.category.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [filterCategory, searchQuery]);

      const categories = [
        { id: 'all', label: 'Tất cả 20 mẫu' },
        { id: 'Phong bì nhung', label: '💌 Phong bì nhung' },
        { id: 'Polaroid nghệ thuật', label: '📸 Polaroid & Tape' },
        { id: 'Cổng vòm xanh', label: '🌿 Cổng vòm xanh' },
        { id: 'Song ảnh hoa lá', label: '🌸 Song ảnh hoa lá' },
        { id: 'Song Hỷ Đỏ truyền thống', label: '囍 Song Hỷ truyền thống' },
        { id: 'Dải phim Polaroid', label: '🎞️ Dải phim Polaroid' },
      ];

      return (
        <div className="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
          {/* Header giống web mẫu Chung Đôi / WedStory */}
          <header className="text-center max-w-2xl mx-auto mb-8">
            <h1 className="text-3xl sm:text-4xl font-sans font-bold text-stone-900 tracking-tight">
              Mẫu thiệp mời đám cưới
            </h1>
            <p className="mt-2 text-sm text-stone-500 font-light">
              Tạo miễn phí · Thử 3 ngày · Đẹp mới thanh toán<br/>
              Bạn có thể đổi mẫu bất cứ lúc nào khi chỉnh sửa
            </p>
          </header>

          {/* Filter Pills */}
          <div className="flex items-center justify-start sm:justify-center overflow-x-auto no-scrollbar gap-2 pb-3 mb-6">
            {categories.map(cat => (
              <button
                key={cat.id}
                onClick={() => setFilterCategory(cat.id)}
                className={`whitespace-nowrap rounded-full px-4 py-1.5 text-xs font-medium transition-all ${
                  filterCategory === cat.id
                    ? 'bg-rose-600 text-white shadow-sm'
                    : 'bg-white text-stone-600 hover:bg-stone-100 border border-stone-200'
                }`}
              >
                {cat.label}
              </button>
            ))}
          </div>

          {/* Cards Grid: Bố cục 5 cột chuẩn web mẫu */}
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-5">
            {filtered.map(template => (
              <WeddingCard
                key={template.id}
                template={template}
                onPreview={(tpl) => setPreviewTemplate(tpl)}
              />
            ))}
          </div>

          {/* Modal Preview */}
          {previewTemplate && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
              onClick={() => setPreviewTemplate(null)}
            >
              <div
                className="relative w-full max-w-lg bg-white rounded-2xl overflow-hidden shadow-2xl p-6 flex flex-col items-center"
                onClick={e => e.stopPropagation()}
              >
                <button
                  onClick={() => setPreviewTemplate(null)}
                  className="absolute top-3 right-3 text-stone-400 hover:text-stone-800 text-lg font-bold"
                >
                  ✕
                </button>
                <div className="w-[240px] shadow-xl rounded-xl overflow-hidden my-3">
                  <WeddingCard template={previewTemplate} onPreview={() => {}} />
                </div>
                <h3 className="font-serif text-xl font-bold text-stone-900 mt-2">
                  {previewTemplate.name}
                </h3>
                <p className="text-xs text-stone-500 font-light mt-0.5">
                  Phong cách: {previewTemplate.category}
                </p>
                <button
                  onClick={() => { alert(`Đã chọn mẫu: ${previewTemplate.name}`); setPreviewTemplate(null); }}
                  className="mt-5 w-full rounded-full bg-stone-900 py-3 text-xs font-bold text-white uppercase tracking-wider hover:bg-stone-800 shadow-md"
                >
                  Dùng mẫu này để tạo thiệp
                </button>
              </div>
            </div>
          )}

          {/* Floating Button: Mở Trợ lý AI Cá Nhân Hoá */}
          <button
            onClick={() => setShowAiWishModal(true)}
            className="fixed bottom-6 right-6 z-40 flex items-center gap-2 px-5 py-3 rounded-full bg-gradient-to-r from-rose-700 to-amber-700 text-white shadow-xl hover:shadow-2xl hover:scale-105 transition-all text-xs sm:text-sm font-semibold tracking-wide cursor-pointer"
          >
            <span className="text-base">✨</span>
            <span>Trợ lý Cá Nhân Hoá AI (Gemini)</span>
          </button>

          {/* Modal Trợ lý AI Chúc Cưới */}
          {showAiWishModal && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
              onClick={() => setShowAiWishModal(false)}
            >
              <AIAssistantWish
                initialName=""
                brideGroomNames="Cô dâu & Chú rể"
                onClose={() => setShowAiWishModal(false)}
              />
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
